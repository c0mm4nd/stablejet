services:
  app:
    image: ghcr.io/c0mm4nd/stablejet:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config.json:/app/lib/config.json:ro
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.scope=stablejet"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCOPE=stablejet
